version: 1
applications:
  - appRoot: icarus-ui
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - env | grep -e CUSTOM_ -e COGNITO_ -e API_ENDPOINT -e MAIN_TABLE_NAME >> .env.production
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
